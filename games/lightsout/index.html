<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="../../css/common.css">
  <title>Lights Out — Mini-Jeux</title>
  <script>
    document.documentElement.setAttribute(
      'data-theme', localStorage.getItem('mj-theme') || 'light');
  </script>
  <style>
    #board {
      display: grid;
      gap: 6px;
      margin: 0 auto;
      background: var(--surface-soft);
      padding: 6px;
      border-radius: 10px;
      width: fit-content;
      touch-action: manipulation;
    }
    .light {
      border-radius: 8px;
      cursor: pointer;
      background: var(--surface-softer);
      box-shadow: inset 0 0 0 2px var(--border);
      transition: background 0.12s, transform 0.1s;
    }
    .light.on {
      background: linear-gradient(135deg, #ffe259, #ffa751);
      box-shadow: 0 0 12px rgba(255,180,80,.7);
    }
    .light:active { transform: scale(0.92); }
    .hint { color: var(--text-soft); font-size: .85em; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="chips" id="modes"></div>
    <p class="best" id="best"></p>
    <div class="info">
      <div class="stat">Coups : <span id="moves">0</span></div>
      <div class="stat">Allumées : <span id="onCount">0</span></div>
    </div>
    <div id="board"></div>
    <p class="hint">Éteins toutes les lumières. Appuyer bascule la case et ses voisines.</p>
    <div class="buttons">
      <button onclick="Game.restart()">🔄 Recommencer</button>
    </div>
  </div>

  <div class="overlay" id="over">
    <div class="overlay-content">
      <h2>🎉 Éteint !</h2>
      <p id="overMsg"></p>
      <div class="buttons">
        <button class="ghost" onclick="Game.closeOver()">Fermer</button>
        <button onclick="Game.closeOver(); Game.restart();">Rejouer</button>
      </div>
    </div>
  </div>

  <script src="../../js/core.js"></script>
  <script src="lightsout.js"></script>
</body>
</html>
