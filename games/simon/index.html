<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="../../css/common.css">
  <title>Simon — Mini-Jeux</title>
  <script>
    document.documentElement.setAttribute(
      'data-theme', localStorage.getItem('mj-theme') || 'light');
  </script>
  <style>
    #pads {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 0 auto;
      width: fit-content;
    }
    .pad {
      border-radius: 16px;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.12s, transform 0.1s;
    }
    .pad.lit { opacity: 1; transform: scale(1.04); }
    .pad.green  { background: #2ecc71; }
    .pad.red    { background: #e74c3c; }
    .pad.yellow { background: #f1c40f; }
    .pad.blue   { background: #3498db; }
    .hint { color: var(--text-soft); font-size: .9em; margin: 14px 0 4px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <div class="chips" id="modes"></div>
    <p class="best" id="best"></p>
    <div class="info">
      <div class="stat">Niveau : <span id="level">0</span></div>
      <div class="stat">Record : <span id="hiscore">0</span></div>
    </div>
    <div id="pads">
      <div class="pad green"  data-i="0"></div>
      <div class="pad red"    data-i="1"></div>
      <div class="pad yellow" data-i="2"></div>
      <div class="pad blue"   data-i="3"></div>
    </div>
    <p class="hint" id="hint">Appuie sur « Jouer » et reproduis la séquence.</p>
    <div class="buttons">
      <button onclick="Game.startRun()">▶️ Jouer</button>
    </div>
  </div>

  <div class="overlay" id="over">
    <div class="overlay-content">
      <h2>💥 Raté</h2>
      <p id="overMsg"></p>
      <div class="buttons">
        <button class="ghost" onclick="Game.closeOver()">Fermer</button>
        <button onclick="Game.closeOver(); Game.startRun();">Rejouer</button>
      </div>
    </div>
  </div>

  <script src="../../js/core.js"></script>
  <script src="simon.js"></script>
</body>
</html>
