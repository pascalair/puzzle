<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/common.css">
  <title>Mini-Jeux</title>
  <script>
    // Applique le thème avant le rendu pour éviter le flash blanc/sombre.
    document.documentElement.setAttribute(
      'data-theme', localStorage.getItem('mj-theme') || 'light');
  </script>
  <style>
    .hub-header {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }
    .hub-header h1 {
      flex: 1;
      color: #fff;
      font-size: clamp(1.8em, 7vw, 2.8em);
      text-shadow: 0 2px 10px rgba(0,0,0,.25);
    }
    .subtitle {
      color: rgba(255,255,255,.85);
      margin-bottom: 20px;
      font-size: clamp(.9em, 3.5vw, 1.1em);
      text-align: center;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 560px;
    }
    .game-card {
      background: var(--surface);
      border-radius: 18px;
      padding: 20px 14px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 8px 24px var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform .15s, box-shadow .15s;
      position: relative;
      overflow: hidden;
    }
    .game-card:active {
      transform: scale(0.96);
    }
    .game-card .emoji {
      font-size: clamp(2.4em, 11vw, 3.4em);
      line-height: 1;
    }
    .game-card .name {
      font-weight: bold;
      font-size: clamp(1em, 4.5vw, 1.25em);
    }
    .game-card .best {
      font-size: .8em;
      color: var(--text-soft);
      min-height: 1.1em;
      margin: 0;
    }
    .daily-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #ffce3a;
      color: #5a4500;
      font-size: .65em;
      font-weight: bold;
      padding: 3px 7px;
      border-radius: 8px;
    }
    .daily-badge.done {
      background: #57c779;
      color: #04340f;
    }
    .install-prompt {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      color: var(--text);
      padding: 14px 18px;
      border-radius: 14px;
      box-shadow: 0 6px 20px var(--shadow);
      z-index: 999;
      align-items: center;
      gap: 10px;
    }
    .install-prompt.show { display: flex; }
  </style>
</head>
<body>
  <div class="hub-header">
    <h1>🎮 Mini-Jeux</h1>
    <button class="icon-btn" id="themeBtn" aria-label="Thème">🌓</button>
  </div>
  <p class="subtitle">Choisis un jeu pour passer le temps</p>

  <div class="games-grid" id="gamesGrid"></div>

  <div class="install-prompt" id="installPrompt">
    <span>📲 Installer l'app ?</span>
    <button onclick="installApp()">Installer</button>
    <button class="ghost" onclick="dismissInstall()">Plus tard</button>
  </div>

  <script src="js/core.js"></script>
  <script>
    // Catalogue des jeux. `bestMode`/`bestLabel` servent à afficher le record
    // pertinent sur la carte du hub.
    const GAMES = [
      { id: 'taquin',   name: 'Taquin',     emoji: '🧩', path: 'games/taquin/',    hasDaily: true,  bestMode: 'taille-4',  bestLabel: c => `Record 4×4 : ${c} coups` },
      { id: '2048',     name: '2048',       emoji: '🔢', path: 'games/2048/',      hasDaily: true,  bestMode: 'classique', bestLabel: s => `Record : ${s}` },
      { id: 'demineur', name: 'Démineur',   emoji: '💣', path: 'games/demineur/',  hasDaily: true,  bestMode: 'moyen',     bestLabel: t => `Record moyen : ${formatTime(t)}` },
      { id: 'memory',   name: 'Memory',     emoji: '🃏', path: 'games/memory/',    hasDaily: true,  bestMode: 'paires-8',  bestLabel: c => `Record : ${c} coups` },
      { id: 'lightsout',name: 'Lights Out', emoji: '💡', path: 'games/lightsout/', hasDaily: true,  bestMode: 'taille-5',  bestLabel: c => `Record 5×5 : ${c} coups` },
      { id: 'snake',    name: 'Snake',      emoji: '🐍', path: 'games/snake/',     hasDaily: false, bestMode: 'normal',    bestLabel: s => `Record : ${s}` },
      { id: 'simon',    name: 'Simon',      emoji: '🎵', path: 'games/simon/',     hasDaily: false, bestMode: 'normal',    bestLabel: n => `Record : niv. ${n}` },
    ];

    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';
      GAMES.forEach(g => {
        const best = Records.get(g.id, g.bestMode);
        const dailyDone = Daily.doneToday(g.id);
        const badge = g.hasDaily
          ? `<span class="daily-badge ${dailyDone ? 'done' : ''}">${dailyDone ? '✓ jour' : 'défi'}</span>`
          : '';
        const card = document.createElement('a');
        card.className = 'game-card';
        card.href = g.path;
        card.innerHTML = `
          ${badge}
          <span class="emoji">${g.emoji}</span>
          <span class="name">${g.name}</span>
          <p class="best">${best !== null ? g.bestLabel(best) : '—'}</p>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
      Theme.toggle();
    });

    // --- Installation PWA ---
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installPrompt').classList.add('show');
    });
    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; dismissInstall(); });
      }
    }
    function dismissInstall() {
      document.getElementById('installPrompt').classList.remove('show');
    }

    registerSW('sw.js');
    renderGames();
  </script>
</body>
</html>
